<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息驾驶舱 INFO COCKPIT</title>
<style>
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#0a0e14;color:#dce6f0;
  display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{max-width:640px;background:#111821;border:1px solid #1d2836;border-radius:16px;padding:40px 44px;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:#38bdf8;display:inline-block;margin-bottom:18px;
  box-shadow:0 0 14px #38bdf8;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:24px;letter-spacing:2px;margin:0 0 8px}
p{color:#8fa3b8;font-size:14px;line-height:1.9;margin:6px 0}
code{background:rgba(255,255,255,.06);border:1px solid #1d2836;border-radius:6px;padding:2px 8px;font-size:13px}
b{color:#dce6f0}
</style>
</head>
<body>
<div class="card">
  <span class="dot"></span>
  <h1>信息驾驶舱</h1>
  <p>云端定时任务已就绪，正在等待首次数据生成。</p>
  <p>每天 <b>12:00</b> 与 <b>17:00</b>（北京时间），GitHub Actions 将自动抓取
     A股 / 日本新番 / 俄乌战线 / AI / 硬件外设 / 小岛秀夫 / TWICE / 日本动画产业数据，
     并在此页面自动更新。</p>
  <p>想立即查看：到仓库 <code>Actions</code> 页点击 <b>Run workflow</b> 手动触发一次，几分钟后刷新本页即可。</p>
</div>
</body>
</html>

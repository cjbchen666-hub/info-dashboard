name: Update InfoDashboard

# 云端定时任务: 每 2 小时自动抓取数据并发布页面
# GitHub Actions 的 cron 使用 UTC: "0 */2 * * *" = 每 2 小时整点(UTC)
# 北京时间 = UTC+8, 对应北京时间整点(8,10,12,...,22,0,2,4,6)
# 部署方式: push 到 gh-pages 分支, Pages 源设置为 "Deploy from a branch" -> gh-pages
on:
  schedule:
    - cron: "0 */2 * * *"   # 每 2 小时(北京时间整点)
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data collector (update.py)
        run: python update.py

      - name: Commit and push refreshed data (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

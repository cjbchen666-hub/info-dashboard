name: Update InfoDashboard

# 云端定时任务: 每天 12:00 / 17:00(北京时间) 自动抓取数据并重新发布页面
# GitHub Actions 的 cron 使用 UTC 时间: 12:00 北京时间 = 04:00 UTC; 17:00 北京时间 = 09:00 UTC
on:
  schedule:
    - cron: "0 4 * * *"   # 每天 12:00 北京时间
    - cron: "0 9 * * *"   # 每天 17:00 北京时间
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data collector (update.py)
        run: python update.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html data.json
          git diff --cached --quiet || git commit -m "chore: refresh dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
